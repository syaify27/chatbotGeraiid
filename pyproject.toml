[project]
name = "rag-chatbot"
version = "1.0.0"
description = "RAG Document Chatbot dengan Google Gemini"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.49.1",
    "google-genai>=1.34.0",
    "langchain-community",
    "langchain>=0.3.27",
    "pypdf",
    "python-docx",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"
